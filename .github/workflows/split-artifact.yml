name: R04 split verified Windows build artifact for accessible QA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/split-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download completed R04 T0 artifact from successful run 42520170832
        uses: actions/download-artifact@v4
        with:
          name: TCA_R04_WINDOWS_T0_NOT_FILM
          run-id: 42520170832
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify expected files and split without changing binaries
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $src=Join-Path $PWD "downloaded/dist/TCA_R04_T0"
          if (!(Test-Path "$src/TCA_R04_T0.exe")) {
            Get-ChildItem downloaded -Depth 3 | Select-Object FullName
            throw "ORIGINAL_EXE_NOT_PRESENT"
          }
          if (!(Test-Path "$src/model/kokoro-v1.0.onnx")) { throw "ORIGINAL_KOKORO_MODEL_MISSING" }
          if (!(Test-Path "$src/model/voices-v1.0.bin")) { throw "ORIGINAL_KOKORO_VOICES_MISSING" }
          New-Item -ItemType Directory -Force staging/EXE,staging/MODEL/model,staging/EVIDENCE | Out-Null
          robocopy "$src" "staging/EXE" /E /XD "$src/model" /NFL /NDL /NJH /NJS /NC /NS
          if ($LASTEXITCODE -gt 7) { throw "ROBOCOPY_FAILED_$LASTEXITCODE" }
          Copy-Item "$src/model/*" "staging/MODEL/model" -Recurse -Force
          foreach ($dir in @("OUT_TONE_PYTHON","OUT_TONE_EXE","OUT_KOKORO_MICHAEL","OUT_KOKORO_ADAM")) {
            if (!(Test-Path "downloaded/$dir/QA.json")) { throw "QA_MISSING_$dir" }
            Copy-Item "downloaded/$dir" "staging/EVIDENCE/$dir" -Recurse
          }
          Copy-Item "downloaded/LICENSE_AUDIT.md" "staging/EVIDENCE/"
          if (Test-Path "downloaded/requirements-installed.txt") { Copy-Item "downloaded/requirements-installed.txt" "staging/EVIDENCE/" }
          Get-ChildItem staging -Recurse -File | Where-Object { $_.Name -ne 'SHA256_CHECKSUMS.txt' } | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $( $_.FullName.Substring((Resolve-Path staging).Path.Length+1) )"
          } | Out-File -Encoding utf8 staging/EVIDENCE/SHA256_CHECKSUMS.txt
          Get-ChildItem staging/EXE -Recurse -File | Measure-Object Length -Sum | Format-List
          Get-ChildItem staging/MODEL -Recurse -File | Measure-Object Length -Sum | Format-List
          Get-ChildItem staging/EVIDENCE -Recurse -File | Measure-Object Length -Sum | Format-List
      - name: Upload standalone Windows engine without model (technical)
        uses: actions/upload-artifact@v4
        with:
          name: TCA_R04_WIN_EXE_TECHNICAL_NOT_RELEASED
          path: staging/EXE/
          retention-days: 7
          compression-level: 0
      - name: Upload Kokoro model separately
        uses: actions/upload-artifact@v4
        with:
          name: TCA_R04_KOKORO_MODEL_TECHNICAL
          path: staging/MODEL/
          retention-days: 7
          compression-level: 0
      - name: Upload neutral voice and media QA evidence separately
        uses: actions/upload-artifact@v4
        with:
          name: TCA_R04_WINDOWS_19_SCENE_QA
          path: staging/EVIDENCE/
          retention-days: 7
          compression-level: 0
