name: R04 Windows T0 - Public Neutral Fixture (NOT FILM)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-win.txt"
      - ".github/workflows/windows-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-t0:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win.txt
          python -m pip freeze | Out-File -Encoding utf8 requirements-installed.txt
      - name: Engine unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: 19-scene Windows Python smoke with TEST TONE (not speech)
        shell: pwsh
        run: |
          python src/main.py --ci-smoke --out OUT_TONE_PYTHON
          if (!(Test-Path OUT_TONE_PYTHON/QA.json)) { throw "TONE_PYTHON_QA_MISSING" }
      - name: Build Windows x64 GUI EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name TCA_R04_T0 --collect-all imageio_ffmpeg --collect-all PIL --collect-all kokoro_onnx --collect-all onnxruntime --collect-all phonemizer --collect-all espeakng_loader --collect-all soundfile src/main.py
          if (!(Test-Path dist/TCA_R04_T0/TCA_R04_T0.exe)) { throw "WINDOWS_EXE_MISSING" }
          Get-FileHash dist/TCA_R04_T0/TCA_R04_T0.exe -Algorithm SHA256 | Format-List
      - name: 19-scene Windows EXE smoke with TEST TONE (not speech)
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/TCA_R04_T0/TCA_R04_T0.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList @('--ci-smoke','--out','OUT_TONE_EXE') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE_TONE_FAILED_$($p.ExitCode)" }
          if (!(Test-Path OUT_TONE_EXE/QA.json)) { throw "EXE_TONE_QA_MISSING" }
          Get-Content OUT_TONE_EXE/QA.json
      - name: Download official Kokoro v1.0 model and matching voices
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -Force -ItemType Directory -Path models | Out-Null
          $url="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          Invoke-WebRequest -Uri "$url/kokoro-v1.0.onnx" -OutFile "models/kokoro-v1.0.onnx"
          Invoke-WebRequest -Uri "$url/voices-v1.0.bin" -OutFile "models/voices-v1.0.bin"
          if ((Get-Item "models/kokoro-v1.0.onnx").Length -lt 100000000) { throw "MODEL_INCOMPLETE" }
          if ((Get-Item "models/voices-v1.0.bin").Length -lt 10000000) { throw "VOICES_INCOMPLETE" }
          Get-FileHash "models/kokoro-v1.0.onnx" -Algorithm SHA256 | Format-List
          Get-FileHash "models/voices-v1.0.bin" -Algorithm SHA256 | Format-List
      - name: Real Kokoro speech am_michael - 19 neutral scenes
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/TCA_R04_T0/TCA_R04_T0.exe').Path
          $models=(Resolve-Path 'models').Path
          $p=Start-Process -FilePath $exe -ArgumentList @('--ci-kokoro','--voice','am_michael','--model-dir',$models,'--out','OUT_KOKORO_MICHAEL') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "KOKORO_MICHAEL_FAILED_$($p.ExitCode)" }
          if (!(Test-Path OUT_KOKORO_MICHAEL/QA.json)) { throw "KOKORO_MICHAEL_QA_MISSING" }
          Get-Content OUT_KOKORO_MICHAEL/QA.json
      - name: Real Kokoro speech am_adam - 19 neutral scenes
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/TCA_R04_T0/TCA_R04_T0.exe').Path
          $models=(Resolve-Path 'models').Path
          $p=Start-Process -FilePath $exe -ArgumentList @('--ci-kokoro','--voice','am_adam','--model-dir',$models,'--out','OUT_KOKORO_ADAM') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "KOKORO_ADAM_FAILED_$($p.ExitCode)" }
          if (!(Test-Path OUT_KOKORO_ADAM/QA.json)) { throw "KOKORO_ADAM_QA_MISSING" }
          Get-Content OUT_KOKORO_ADAM/QA.json
      - name: Package Kokoro model with test bundle
        if: success()
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory -Path dist/TCA_R04_T0/model | Out-Null
          Copy-Item models/kokoro-v1.0.onnx dist/TCA_R04_T0/model/
          Copy-Item models/voices-v1.0.bin dist/TCA_R04_T0/model/
          Copy-Item LICENSE_AUDIT.md dist/TCA_R04_T0/
          Copy-Item requirements-installed.txt dist/TCA_R04_T0/
      - name: Upload technical evidence only - NOT RELEASE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TCA_R04_WINDOWS_T0_NOT_FILM
          path: |
            dist/TCA_R04_T0/
            OUT_TONE_PYTHON/
            OUT_TONE_EXE/
            OUT_KOKORO_MICHAEL/
            OUT_KOKORO_ADAM/
            requirements-installed.txt
            LICENSE_AUDIT.md
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
